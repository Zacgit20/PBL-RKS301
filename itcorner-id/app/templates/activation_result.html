<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Status Verifikasi - ITCorner.id</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-5">
    <main class="w-full max-w-md bg-white rounded-2xl shadow p-8 text-center">
        <h1 class="text-2xl font-bold text-slate-900 mb-4">
            Status Verifikasi
        </h1>
        <p class="text-sm text-slate-600 mb-6">{{ message }}</p>
        <a href="{{ url_for('auth.login') }}"
           class="inline-block bg-blue-600 text-white rounded-lg px-6 py-3 text-sm">
            Kembali ke Login
        </a>
    </main>
</body>
</html>
