<!-- ==========================================================================
     KONFIGURASI INTEGRASI TELEGRAM BOT API PADA WAZUH MANAGER (10.10.40.2)
     Tambahkan blok ini ke dalam file /var/ossec/etc/ossec.conf
     ========================================================================== -->

<ossec_config>
  <integration>
    <name>custom-telegram</name>
    <!-- Format pengisian: <TOKEN_BOT_TELEGRAM>|<CHAT_ID_GRUP_SOC> -->
    <api_key>YOUR_BOT_TOKEN|-100XXXXXXXXXX</api_key>
    <hook_url>https://api.telegram.org/botYOUR_BOT_TOKEN/sendMessage</hook_url>
    <!-- Hanya kirim alert penting dengan tingkat keparahan Level 10 ke atas -->
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
