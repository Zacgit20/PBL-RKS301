# ============================================================================
# KONFIGURASI NGINX REVERSE PROXY + MODSECURITY WAF - ITCORNER.ID
# Lokasi Server: Web/App Server DMZ (10.10.10.2)
# ============================================================================

# Redirect seluruh trafik HTTP (80) ke HTTPS (443)
server {
    listen 80;
    server_name itcorner.id www.itcorner.id 10.10.10.2;
    return 301 https://$host$request_uri;
}

# Server Utama HTTPS (Port 443)
server {
    listen 443 ssl http2;
    server_name itcorner.id www.itcorner.id 10.10.10.2;

    # Sertifikat SSL/TLS
    ssl_certificate     /etc/nginx/ssl/itcorner.crt;
    ssl_certificate_key /etc/nginx/ssl/itcorner.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Aktifkan WAF ModSecurity + OWASP CRS
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Batas ukuran upload berkas (Sesuai batas 2MB Avatar & Bukti Bayar)
    client_max_body_size 2M;

    # Security Headers (Hardening Layer-7)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Log Akses dan Error untuk dipantau Wazuh Agent
    access_log /var/log/nginx/itcorner_access.log;
    error_log  /var/log/nginx/itcorner_error.log warn;

    # Teruskan request yang lolos WAF ke kontainer Flask/Gunicorn (Port 5000)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}