# ============================================================================
# KONFIGURASI WAF MODSECURITY & OWASP CRS TUNING - ITCORNER.ID
# Lokasi Server: Web/App Server DMZ (10.10.10.2)
# ============================================================================

# 1. Aktifkan mode pemblokiran aktif (Prevention Mode)
SecRuleEngine On

# 2. Izinkan ModSecurity membaca isi Request Body (Form Login, Checkout, Komentar)
SecRequestBodyAccess On
SecRequestBodyLimit 2097152
SecRequestBodyNoFilesLimit 131072

# 3. Konfigurasi Audit Log berformat JSON agar mudah dibaca oleh Wazuh SIEM (10.10.40.2)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsec_audit.log

# 4. Pengaturan Paranoia Level & Anomaly Scoring OWASP CRS
SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=1"

SecAction \
 "id:900110,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# 5. TUNING FALSE POSITIVE KHUSUS ITCORNER.ID
# Mengecualikan inspeksi biner multipart pada endpoint upload bukti bayar & avatar
# agar file gambar PNG/JPG yang sah tidak terblokir sebagai false positive SQLi/RCE
SecRule REQUEST_URI "@rx ^/(profile/avatar|orders/[0-9]+/payment)$" \
 "id:100010,\
  phase:1,\
  pass,\
  nolog,\
  ctl:ruleRemoveById=920420"