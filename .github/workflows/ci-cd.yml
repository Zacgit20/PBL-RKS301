name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  security-and-testing:
    name: security-and-testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./itcorner-id

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static Application Security Testing (Bandit SAST)
        run: bandit -r app/ -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit -r requirements.txt || true

      - name: Run Automated Unit Tests (Pytest)
        run: PYTHONPATH=. pytest tests/unit/ -v

  build-and-deploy:
    name: build-and-deploy (DMZ 10.10.10.2)
    needs: security-and-testing
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./itcorner-id

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Build Production Docker Image
        run: docker build -t itcorner-app:latest .

      - name: 3. Container Vulnerability Scan (Trivy)
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 itcorner-app:latest

      - name: 4. Deploy Container to Web Server DMZ (10.10.10.2)
        run: bash scripts/deploy.sh

      - name: 5. Verify Deployment & Auto-Rollback Check
        run: bash scripts/healthcheck.sh
