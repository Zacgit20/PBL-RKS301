name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  security-and-testing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./itcorner-id

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          echo "Menjalankan pemindaian keamanan kode Python di folder app/..."
          bandit -r app/ -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          echo "Memeriksa kerentanan pustaka Python..."
          pip-audit -r requirements.txt || true

      - name: Run Automated Unit Tests (Pytest)
        run: |
          echo "Menjalankan Unit Testing..."
          PYTHONPATH=. pytest tests/unit/