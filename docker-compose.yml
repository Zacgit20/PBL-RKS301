version: "3.8"

services:
  db:
    image: postgres:15
    container_name: itcorner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: itcorner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itcorner_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
